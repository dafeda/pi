[project]
name = "scientific-harness"
version = "0.1.0"
description = "Infer hidden flow barriers from simulated pressure measurements on a laptop"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fipy==4.0.3",
    "iterative-ensemble-smoother==1.3.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    # FiPy 4.0.3 imports numpy.core.umath; no newer FiPy release fixes this import yet.
    "ignore:numpy.core is deprecated.*:DeprecationWarning:fipy.tools.numerix",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
